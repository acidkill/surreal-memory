name: Release

on:
  push:
    tags:
      - "v*"
  # Lets this be dispatched explicitly against a tag ref (actions/checkout with
  # no ref: override resolves GITHUB_REF to whatever ref triggered the run, so
  # `gh workflow run release.yml --ref vX.Y.Z` reproduces a real tag push with
  # no changes needed below). Exists because a GITHUB_TOKEN-driven tag creation
  # (e.g. publishing a draft release from another Action) does NOT fire
  # `push: tags:` — GitHub's own anti-recursion rule for the default token —
  # so auto-publish-release.yml dispatches this explicitly as a fallback.
  workflow_dispatch: {}

jobs:
  # ── Gate: validate version consistency ──────────────────────────
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Shares one implementation with the `Version Consistency` job in ci.yml,
      # so this can only fail on something CI could not have known: a tag that
      # disagrees with a tree that is internally consistent. The previous
      # inline version compared the tag against pyproject.toml and __init__.py
      # only — it never saw the npm manifests the publish jobs below read.
      - name: Check tag matches every version-bearing file
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          python3 scripts/pre_ship.py --only versions --expect "$TAG"

  # ── Gate: run full CI before publishing ─────────────────────────
  ci:
    name: CI checks
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,server]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check
        run: mypy src/ --ignore-missing-imports

      - name: Test
        run: pytest tests/ -v --timeout=60 -n auto -m "not stress" --cov=surreal_memory --cov-report=term-missing --cov-fail-under=67 --dist worksteal

  # ── Build distribution ──────────────────────────────────────────
  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # ── Publish to PyPI ─────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/surreal-memory
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ── GitHub Release ──────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — uploading assets only."
            gh release upload '${{ github.ref_name }}' \
              --repo '${{ github.repository }}' \
              --clobber \
              dist/* || true
          else
            gh release create '${{ github.ref_name }}' \
              --repo '${{ github.repository }}' \
              --title '${{ github.ref_name }}' \
              --generate-notes \
              dist/*
          fi

  # ── Publish npm (OpenClaw plugin) ──────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build and publish OpenClaw plugin
        working-directory: integrations/surrealmemory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN not set — skipping npm publish."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # Idempotent re-run guard: skip ONLY if this exact version is already live.
          if [ "$(npm view "surrealmemory@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::surrealmemory@$VERSION already on npm — nothing to do."
            exit 0
          fi
          npm ci || npm install
          # Sync the package version to the release tag (package.json drift was the
          # root cause of releases 2.11.0/2.12.0 silently re-publishing 2.10.5).
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build
          # No fallback mask: a real publish failure must fail the job loudly.
          npm publish --access public

  # ── Publish TypeScript SDK ─────────────────────────────────────
  publish-sdk:
    name: Publish TypeScript SDK to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build and publish SDK
        working-directory: integrations/surreal-memory-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN not set — skipping SDK publish."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # Idempotent re-run guard: skip ONLY if this exact version is already live.
          if [ "$(npm view "@acidkill/surreal-memory-client@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::@acidkill/surreal-memory-client@$VERSION already on npm — nothing to do."
            exit 0
          fi
          npm ci || npm install
          # Sync the package version to the release tag (same drift class as publish-npm).
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run typecheck
          npm run build
          # No fallback mask: a real publish failure must fail the job loudly.
          npm publish --access public

  # ── Publish to ClawHub ─────────────────────────────────────────
  publish-clawhub:
    name: Publish to ClawHub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ClawHub CLI
        run: npm install -g clawdhub undici 2>/dev/null || pip install clawdhub 2>/dev/null || true

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::notice::CLAWHUB_TOKEN not set — skipping ClawHub publish."
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          clawdhub login --token "$CLAWHUB_TOKEN" --no-browser \
            || { echo "::warning::ClawHub login failed — skipping"; exit 0; }
          clawdhub publish .claude-plugin --slug surreal-memory --version "$VERSION" \
            || echo "::warning::ClawHub publish failed — update manually"

  # ── Publish VS Code Extension ──────────────────────────────────
  publish-vscode:
    name: Publish VS Code Extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and publish extension
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npm ci || npm install
          # Sync the extension version to the release tag (same drift class as publish-npm).
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run compile 2>/dev/null || npm run build 2>/dev/null || true

          # VS Code Marketplace — no fallback mask: with a PAT set, a publish
          # failure must fail the job loudly instead of reporting green.
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --pat "$VSCE_PAT"
          else
            echo "::warning::VSCE_PAT not set — skipping VS Code Marketplace"
          fi

          # Open VSX Registry
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish --pat "$OVSX_PAT"
          else
            echo "::warning::OVSX_PAT not set — skipping Open VSX"
          fi
