[package]
name = "smem-rust-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread","macros","net","io-util","process","time","fs","sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"

[[bin]]
name = "smem-spike"
path = "src/main.rs"
