# SurrealMemory + SurrealDB + Cloudflare Sync Hub
# Usage:
#   cp .env.example .env   # edit with your keys
#   docker compose -f docker-compose.surrealdb.yml up -d
#
# Dashboard:  http://localhost:8000/ui
# API:        http://localhost:8000
# Health:     http://localhost:8000/health
# SurrealDB:  http://localhost:8001 (internal only)

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.0
    # surrealkv:///surrealdb/data/db makes storage PERSISTENT. Without a datastore
    # path `surreal start` defaults to in-memory and ALL data is lost on restart.
    # `user: root` is required because a fresh named volume is root-owned and the
    # image's default `nonroot` user cannot create the datastore directory in it.
    #
    # v3.2.0: the datastore path MUST come before the capability flags — the
    # multi-valued `--allow-eval-query` would otherwise swallow the path as its
    # value. `--allow-experimental gql` + `--allow-eval-query` enable ISO GQL
    # (eval::gql) used internally by get_path's fast-path; `gql` is the (hidden)
    # experimental token and eval-query is denied by default even under --allow-all.
    command: start surrealkv:///surrealdb/data/db --user root --pass ${SURREALDB_PASS:-surrealmemory} --bind 0.0.0.0:8001 --allow-experimental gql --allow-eval-query
    user: root
    ports:
      - "8001:8001"
    volumes:
      - surrealdb_data:/surrealdb/data
    healthcheck:
      # v3.2 adds an HTTP /ready endpoint, but the distroless image has no curl,
      # so we keep `surreal isready` (which the binary ships and works headless).
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8001"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  surreal-memory:
    build:
      context: .
      dockerfile: Dockerfile.surrealdb
    # Host networking: the app shares the host's loopback, so it reaches the
    # host-local llamastash (embeddings + reranker on 127.0.0.1:11435) directly —
    # no host.docker.internal, and llamastash never has to bind a docker bridge
    # (smaller exposure). SurrealDB stays on the bridge; the app reaches it via
    # the published host port 8001. Note: `ports:` is invalid under host net —
    # the app binds SURREAL_MEMORY_HOST:SURREAL_MEMORY_PORT on the host itself.
    network_mode: host
    environment:
      # Core
      - SURREAL_MEMORY_DIR=/data
      - SURREAL_MEMORY_BRAIN=${SURREAL_MEMORY_BRAIN:-default}
      # Loopback-only bind: the dashboard is reachable solely from this machine.
      # Set SURREAL_MEMORY_HOST=0.0.0.0 in .env to expose it on the LAN.
      - SURREAL_MEMORY_HOST=${SURREAL_MEMORY_HOST:-127.0.0.1}
      - SURREAL_MEMORY_PORT=8000
      # Dashboard access gate (require_local_request): under host networking the
      # browser reaches the app from 127.0.0.1, which is always trusted — the
      # docker-bridge CIDR is no longer needed. Kept overridable for LAN setups.
      - SURREAL_MEMORY_TRUSTED_NETWORKS=${SURREAL_MEMORY_TRUSTED_NETWORKS:-}

      # SurrealDB — via its published host port (no docker DNS under host net).
      - SURREAL_MEMORY_STORAGE=surrealdb
      - SURREALDB_URL=${SURREALDB_URL:-http://127.0.0.1:8001}
      - SURREALDB_USER=${SURREALDB_USER:-root}
      - SURREALDB_PASS=${SURREALDB_PASS:-surrealmemory}
      - SURREALDB_NS=surreal_memory
      - SURREALDB_DB=default

      # Embedding — local BGE (bge-m3, 1024-dim) via the OpenAI-compatible
      # llamastash endpoint on the host loopback (shared under host networking).
      - SURREAL_MEMORY_EMBEDDING_ENABLED=${SURREAL_MEMORY_EMBEDDING_ENABLED:-true}
      - SURREAL_MEMORY_EMBEDDING_PROVIDER=${SURREAL_MEMORY_EMBEDDING_PROVIDER:-openai}
      - SURREAL_MEMORY_EMBEDDING_MODEL=${SURREAL_MEMORY_EMBEDDING_MODEL:-bge-m3-FP16}
      - SURREAL_MEMORY_EMBEDDING_DIMENSION=${SURREAL_MEMORY_EMBEDDING_DIMENSION:-1024}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL_CONTAINER:-http://127.0.0.1:11435/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-noauth}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

      # Cloud Sync
      - SURREAL_MEMORY_SYNC_ENABLED=true
      - SURREAL_MEMORY_SYNC_AUTO=true
      # Set SURREAL_MEMORY_HUB_URL in your .env — personal hub URL, not committed here.
      - SURREAL_MEMORY_HUB_URL=${SURREAL_MEMORY_HUB_URL:-}
      # Set SURREAL_MEMORY_API_KEY in your .env — never hardcode it in this committed file.
      - SURREAL_MEMORY_API_KEY=${SURREAL_MEMORY_API_KEY:-}

      # Encryption (optional)
      - SURREAL_MEMORY_ENCRYPTION_ENABLED=${SURREAL_MEMORY_ENCRYPTION_ENABLED:-false}
      - SURREAL_MEMORY_ENCRYPTION_KEYS_DIR=/data/keys

      # MCP — use stdio transport: each tool spawns `smem-mcp` directly
      # Port 8765 exposed for optional HTTP transport: smem-mcp --http 8765
      # Claude Code: claude mcp add --scope user surreal-memory -- smem-mcp
      # opencode: add to opencode MCP config (see below)

    depends_on:
      surrealdb:
        condition: service_healthy
    volumes:
      - nm_data:/data
    restart: unless-stopped

volumes:
  surrealdb_data:
  nm_data:
